[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotrust"
version = "0.1.0"
description = "Verificador de reconciliacion de confianza para audio sintetico (C2PA + watermark AudioSeal)."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com" }]
dependencies = [
    "c2pa-python==0.36.0",
    "audioseal==0.2.0",
    "torch",
    "huggingface_hub",
    "soundfile",
    "numpy",
]

[project.scripts]
audiotrust = "audiotrust.cli:main"

[tool.setuptools]
packages = ["audiotrust"]
